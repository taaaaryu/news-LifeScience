name: Generate Life Science Digest

on:
  schedule:
    # 07:00 JST (22:00 UTC on the previous day)
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-digest-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch PubMed candidates and build prompt
        id: candidates
        run: python3 .github/scripts/fetch_pubmed.py

      - name: Install OpenAI SDK
        if: steps.candidates.outputs.candidate_count != '0'
        run: python3 -m pip install --quiet openai

      - name: Generate digest with OpenAI GPT
        if: steps.candidates.outputs.candidate_count != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured." >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          from openai import OpenAI

          prompt = Path('/tmp/prompt.txt').read_text(encoding='utf-8')
          client = OpenAI()
          response = client.responses.create(
              model='gpt-5.2',
              input=prompt,
              reasoning={'effort': 'low'},
              max_output_tokens=2500,
              store=False,
          )
          text = response.output_text.strip()
          if not text:
              raise RuntimeError('OpenAI returned an empty digest')
          Path('/tmp/digest.md').write_text(text + '\n', encoding='utf-8')
          PY

      - name: Save digest
        if: steps.candidates.outputs.candidate_count != '0'
        run: |
          mkdir -p digests
          cp /tmp/digest.md "digests/${{ steps.candidates.outputs.date }}.md"

      - name: Commit and push
        if: steps.candidates.outputs.candidate_count != '0'
        run: |
          git config user.name "life-science-digest-bot"
          git config user.email "actions@github.com"
          DIGEST_FILE="digests/${{ steps.candidates.outputs.date }}.md"
          SOURCE_FILE="/tmp/digest.md"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p digests
            cp "$SOURCE_FILE" "$DIGEST_FILE"
            git add "$DIGEST_FILE"
            if git diff --cached --quiet; then
              echo "no changes to commit"
              exit 0
            fi
            git commit -m "digest: ${{ steps.candidates.outputs.date }}"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
